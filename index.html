<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resolução de Programação Linear</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="mb-3">Programação Linear - Método Gráfico e Simplex</h1>
      <p class="text-muted">Informe um problema com variáveis não negativas.</p>

      <section class="card mb-3">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-sm-3">
              <label class="form-label" for="quantidadeVariaveis">Variáveis de decisão</label>
              <input id="quantidadeVariaveis" class="form-control" type="number" min="2" value="2" />
            </div>
            <div class="col-sm-3">
              <label class="form-label" for="quantidadeRestricoes">Restrições</label>
              <input id="quantidadeRestricoes" class="form-control" type="number" min="1" value="3" />
            </div>
            <div class="col-sm-3">
              <label class="form-label" for="tipoProblema">Tipo do problema</label>
              <select id="tipoProblema" class="form-select">
                <option value="max" selected>Maximizar</option>
                <option value="min">Minimizar</option>
              </select>
            </div>
            <div class="col-sm-3">
              <button id="construirFormulario" class="btn btn-primary w-100">Gerar campos</button>
            </div>
            <div class="col-sm-3">
              <button id="carregarExemplo" class="btn btn-outline-secondary w-100">Carregar exemplo</button>
            </div>
          </div>
        </div>
      </section>

      <section class="card mb-3">
        <div class="card-body">
          <h2 class="h5" id="tituloObjetivo">Função objetivo (maximizar)</h2>
          <div id="containerObjetivo" class="table-responsive"></div>
        </div>
      </section>

      <section class="card mb-3">
        <div class="card-body">
          <h2 class="h5">Restrições</h2>
          <div id="containerRestricoes" class="table-responsive"></div>
        </div>
      </section>

      <section class="card mb-3">
        <div class="card-body">
          <h2 class="h6">Métodos de resolução</h2>
          <div class="d-flex flex-wrap gap-3 align-items-center mb-2">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="metodoGrafico" checked />
              <label class="form-check-label" for="metodoGrafico">Método Gráfico</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="metodoSimplex" checked />
              <label class="form-check-label" for="metodoSimplex">Simplex</label>
            </div>
            <button id="resolverSelecionados" class="btn btn-success">Resolver métodos selecionados</button>
          </div>
          <div id="dicaMetodos" class="small text-muted"></div>
        </div>
      </section>

      <section class="card mb-3">
        <div class="card-body">
          <h2 class="h5">Resultado</h2>
          <div id="resumoProblema"></div>
          <div id="resultado" class="mb-3"></div>
          <div class="row g-3">
            <div class="col-lg-8">
              <canvas id="graficoCanvas" width="900" height="500"></canvas>
            </div>
            <div class="col-lg-4">
              <div id="cardVerticesGrafico" class="card h-100">
                <div class="card-body">
                  <h3 class="h6">Valores da função nos vértices</h3>
                  <div id="tabelaVerticesGrafico" class="table-responsive small text-muted">Resolva pelo Método Gráfico para visualizar os valores.</div>
                </div>
              </div>
            </div>
          </div>
          <div id="tabelaSimplex" class="table-responsive mt-3"></div>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
